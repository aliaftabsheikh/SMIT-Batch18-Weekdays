<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora — Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <script src="./crud.js" type="module" defer></script>
    <style>
        /* ===================== Aurora design tokens ===================== */
        :root {
            --bg: #070b16;
            --bg-2: #0b1120;
            --surface: rgba(255, 255, 255, 0.045);
            --surface-strong: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.09);
            --border-strong: rgba(255, 255, 255, 0.16);

            --violet: #8b5cf6;
            --indigo: #6366f1;
            --cyan: #22d3ee;
            --magenta: #ec4899;
            --emerald: #34d399;

            --grad-accent: linear-gradient(135deg, #8b5cf6 0%, #6366f1 45%, #22d3ee 100%);
            --grad-text: linear-gradient(120deg, #c4b5fd 0%, #a5b4fc 40%, #67e8f9 100%);

            --ink: #eef2ff;
            --ink-soft: #b6c0da;
            --ink-mute: #6b7690;

            --radius: 18px;
            --radius-sm: 12px;
            --shadow-glow: 0 0 0 1px var(--border), 0 20px 50px -22px rgba(99, 102, 241, 0.55);
            --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--ink);
            background: var(--bg);
            position: relative;
            overflow-x: hidden;
            padding: clamp(1.25rem, 4vw, 3.5rem) 1.25rem 4rem;
            display: flex;
            justify-content: center;
        }

        /* Signature: drifting aurora light field behind everything */
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: -30% -10% auto -10%;
            height: 90vh;
            z-index: -1;
            filter: blur(70px);
            opacity: 0.7;
            pointer-events: none;
        }

        body::before {
            background:
                radial-gradient(45% 55% at 20% 25%, rgba(139, 92, 246, 0.55), transparent 70%),
                radial-gradient(40% 50% at 78% 18%, rgba(34, 211, 238, 0.42), transparent 70%),
                radial-gradient(45% 45% at 55% 40%, rgba(236, 72, 153, 0.32), transparent 70%);
            animation: drift 22s var(--ease) infinite alternate;
        }

        body::after {
            inset: auto -10% -40% -10%;
            height: 70vh;
            background:
                radial-gradient(45% 60% at 70% 80%, rgba(99, 102, 241, 0.4), transparent 70%),
                radial-gradient(40% 50% at 25% 90%, rgba(34, 211, 238, 0.28), transparent 70%);
            animation: drift 28s var(--ease) infinite alternate-reverse;
        }

        @keyframes drift {
            0% {
                transform: translate3d(-4%, -2%, 0) scale(1);
            }

            100% {
                transform: translate3d(5%, 3%, 0) scale(1.12);
            }
        }

        .app {
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: rise 0.7s var(--ease) both;
        }

        /* ===================== Header ===================== */
        .masthead {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .mark {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: var(--grad-accent);
            display: grid;
            place-items: center;
            box-shadow: 0 10px 30px -8px rgba(99, 102, 241, 0.8);
            flex: none;
        }

        .mark svg {
            width: 24px;
            height: 24px;
            stroke: #0a0f1e;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2rem, 6vw, 2.7rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1;
            background: var(--grad-text);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tagline {
            color: var(--ink-mute);
            font-size: 0.9rem;
            letter-spacing: 0.01em;
        }

        .stats {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .chip {
            display: inline-flex;
            align-items: baseline;
            gap: 0.45rem;
            padding: 0.5rem 0.9rem;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--ink-soft);
        }

        .chip b {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--ink);
        }

        .chip .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            align-self: center;
        }

        .chip.active .dot {
            background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
        }

        .chip.done .dot {
            background: var(--emerald);
            box-shadow: 0 0 10px var(--emerald);
        }

        /* ===================== Glass card shell ===================== */
        .glass {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(16px) saturate(1.4);
            -webkit-backdrop-filter: blur(16px) saturate(1.4);
        }

        /* ===================== Add form ===================== */
        .composer {
            padding: 0.55rem;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            transition: box-shadow 0.35s var(--ease), border-color 0.35s var(--ease);
        }

        .composer:focus-within {
            border-color: transparent;
            box-shadow: var(--shadow-glow), 0 0 0 1.5px rgba(139, 92, 246, 0.7);
        }

        .composer-row {
            display: flex;
            gap: 0.55rem;
        }

        .field {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--ink);
            font: inherit;
            font-size: 1rem;
            padding: 0.85rem 0.95rem;
            border-radius: var(--radius-sm);
        }

        .field::placeholder {
            color: var(--ink-mute);
        }

        .field:focus {
            outline: none;
        }

        #task-detail {
            font-size: 0.9rem;
            color: var(--ink-soft);
            padding-top: 0;
        }

        .add-btn {
            flex: none;
            border: none;
            cursor: pointer;
            width: 52px;
            border-radius: var(--radius-sm);
            background: var(--grad-accent);
            color: #0a0f1e;
            display: grid;
            place-items: center;
            transition: transform 0.2s var(--ease), filter 0.2s var(--ease), box-shadow 0.2s var(--ease);
            box-shadow: 0 8px 20px -8px rgba(99, 102, 241, 0.9);
        }

        .add-btn svg {
            width: 22px;
            height: 22px;
            stroke: #0a0f1e;
        }

        .add-btn:hover {
            transform: translateY(-1px) scale(1.03);
            filter: brightness(1.08);
        }

        .add-btn:active {
            transform: scale(0.96);
        }

        .add-btn.is-busy {
            pointer-events: none;
            opacity: 0.65;
        }

        .add-btn.is-busy svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===================== Attach photo ===================== */
        .attach-btn {
            flex: none;
            width: 52px;
            border-radius: var(--radius-sm);
            display: grid;
            place-items: center;
            cursor: pointer;
            color: var(--ink-soft);
            background: var(--surface);
            border: 1px solid var(--border);
            transition: color 0.2s, background 0.2s, border-color 0.2s;
        }

        .attach-btn svg {
            width: 20px;
            height: 20px;
        }

        .attach-btn:hover {
            color: var(--ink);
            background: var(--surface-strong);
            border-color: var(--border-strong);
        }

        .attach-btn.has-file {
            color: #0a0f1e;
            background: var(--grad-accent);
            border-color: transparent;
        }

        .attach-preview {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.4rem 0.5rem;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
        }

        .attach-preview[hidden] {
            display: none;
        }

        .attach-preview img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            flex: none;
            border: 1px solid var(--border);
        }

        .attach-name {
            flex: 1;
            min-width: 0;
            font-size: 0.82rem;
            color: var(--ink-soft);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .attach-clear {
            flex: none;
            border: none;
            background: transparent;
            color: var(--ink-mute);
            font-size: 1.2rem;
            line-height: 1;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            transition: color 0.2s, background 0.2s;
        }

        .attach-clear:hover {
            color: var(--magenta);
            background: var(--surface-strong);
        }

        /* ===================== Filters ===================== */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .filters {
            display: inline-flex;
            padding: 0.3rem;
            gap: 0.2rem;
            border-radius: 999px;
        }

        .filter {
            border: none;
            cursor: pointer;
            background: transparent;
            color: var(--ink-mute);
            font: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.45rem 1rem;
            border-radius: 999px;
            transition: color 0.25s, background 0.25s;
        }

        .filter:hover {
            color: var(--ink-soft);
        }

        .filter.is-active {
            color: #0a0f1e;
            background: var(--grad-accent);
            box-shadow: 0 6px 16px -8px rgba(99, 102, 241, 0.9);
        }

        .clear-done {
            border: none;
            background: transparent;
            color: var(--ink-mute);
            font: inherit;
            font-size: 0.82rem;
            cursor: pointer;
            padding: 0.4rem 0.2rem;
            transition: color 0.2s;
        }

        .clear-done:hover {
            color: var(--magenta);
        }

        .clear-done[hidden] {
            display: none;
        }

        /* ===================== Pagination ===================== */
        .pager {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.5rem 0.6rem;
        }

        .pager[hidden] {
            display: none;
        }

        .page-btn {
            border: none;
            cursor: pointer;
            background: transparent;
            color: var(--ink-soft);
            font: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.45rem 1rem;
            border-radius: 999px;
            transition: color 0.25s, background 0.25s;
        }

        .page-btn:hover:not(:disabled) {
            color: #0a0f1e;
            background: var(--grad-accent);
            box-shadow: 0 6px 16px -8px rgba(99, 102, 241, 0.9);
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .page-info {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: var(--ink-mute);
        }

        /* ===================== Account / Auth ===================== */
        .app[hidden] {
            display: none;
        }

        .account {
            margin-left: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.15rem;
            text-align: right;
        }

        .linklike {
            border: none;
            background: transparent;
            cursor: pointer;
            font: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--violet);
            padding: 0;
            transition: color 0.2s;
        }

        .linklike:hover {
            color: var(--cyan);
        }

        #auth-screen {
            width: 100%;
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rise 0.7s var(--ease) both;
        }

        #auth-screen[hidden] {
            display: none;
        }

        .auth-card {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        .auth-brand {
            justify-content: center;
        }

        .auth-form {
            padding: 1.25rem;
            gap: 0.85rem;
        }

        .auth-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 1.15rem;
            color: var(--ink);
            padding: 0.1rem 0.2rem 0.2rem;
        }

        .auth-form .field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
        }

        .auth-form .field:focus {
            border-color: transparent;
            outline: 1.5px solid var(--violet);
        }

        .auth-submit {
            width: 100%;
            height: 48px;
            font: inherit;
            font-weight: 600;
            color: #0a0f1e;
        }

        .auth-switch {
            font-size: 0.85rem;
            color: var(--ink-mute);
            text-align: center;
            display: flex;
            gap: 0.4rem;
            justify-content: center;
        }

        /* ===================== Kanban board ===================== */
        .board-bar {
            display: flex;
            justify-content: flex-end;
            min-height: 1.2rem;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.9rem;
            align-items: start;
        }

        .board[hidden] {
            display: none;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 0.85rem 0.75rem;
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--border);
            min-height: 140px;
        }

        .col-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.1rem 0.35rem;
        }

        .col-title {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--ink-soft);
        }

        .col-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .col-dot.todo {
            background: var(--indigo);
            box-shadow: 0 0 10px var(--indigo);
        }

        .col-dot.doing {
            background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
        }

        .col-dot.done {
            background: var(--emerald);
            box-shadow: 0 0 10px var(--emerald);
        }

        .col-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            min-width: 1.5rem;
            text-align: center;
            padding: 0.1rem 0.45rem;
        }

        .col-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            flex: 1;
            min-height: 64px;
            border-radius: var(--radius-sm);
            transition: background 0.2s, box-shadow 0.2s;
        }

        /* Highlight a column while a card is dragged over it */
        .col-list.drop-target {
            background: rgba(139, 92, 246, 0.08);
            box-shadow: inset 0 0 0 1.5px rgba(139, 92, 246, 0.55);
        }

        .col-empty {
            font-size: 0.8rem;
            color: var(--ink-mute);
            text-align: center;
            padding: 1.1rem 0.5rem;
            border: 1px dashed var(--border-strong);
            border-radius: var(--radius-sm);
            opacity: 0.7;
        }

        /* Board cards: compact, professional, with an optional photo banner */
        .board .task {
            cursor: grab;
            flex-wrap: wrap;
            align-items: center;
            padding: 0.7rem 0.75rem;
            gap: 0.55rem;
            background: var(--surface-strong);
            box-shadow: 0 6px 18px -14px rgba(0, 0, 0, 0.9);
        }

        .board .task.dragging {
            opacity: 0.45;
            cursor: grabbing;
            transform: rotate(1.5deg);
        }

        .board .task .title {
            font-size: 0.92rem;
        }

        /* Photo banner — full card width, above the title/actions row */
        .task-photo {
            flex-basis: 100%;
            width: 100%;
            height: 128px;
            object-fit: cover;
            display: block;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
        }

        @media (max-width: 640px) {
            .board {
                grid-template-columns: 1fr;
            }
        }

        /* ===================== Task list ===================== */
        .list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .task {
            display: flex;
            align-items: flex-start;
            gap: 0.85rem;
            padding: 0.95rem 1rem;
            animation: rise 0.45s var(--ease) both;
            transition: transform 0.25s var(--ease), box-shadow 0.3s var(--ease), border-color 0.3s var(--ease), opacity 0.3s;
        }

        .task:hover {
            transform: translateY(-2px);
            border-color: var(--border-strong);
            box-shadow: 0 18px 40px -26px rgba(34, 211, 238, 0.7);
        }

        .task.leaving {
            opacity: 0;
            transform: translateX(24px);
        }

        .check {
            flex: none;
            width: 24px;
            height: 24px;
            margin-top: 1px;
            border-radius: 8px;
            border: 1.5px solid var(--border-strong);
            background: transparent;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: border-color 0.2s, background 0.25s var(--ease);
        }

        .check svg {
            width: 14px;
            height: 14px;
            stroke: #06210f;
            stroke-width: 3.2;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.2s, transform 0.25s var(--ease);
        }

        .check:hover {
            border-color: var(--emerald);
        }

        .task.completed .check {
            background: linear-gradient(135deg, #34d399, #22d3ee);
            border-color: transparent;
        }

        .task.completed .check svg {
            opacity: 1;
            transform: scale(1);
        }

        .body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--ink);
            word-break: break-word;
            transition: color 0.3s, opacity 0.3s;
        }

        .detail {
            font-size: 0.85rem;
            color: var(--ink-mute);
            word-break: break-word;
        }

        .task.completed .title {
            color: var(--ink-mute);
            text-decoration: line-through;
            text-decoration-color: rgba(52, 211, 153, 0.7);
        }

        .task.completed .detail {
            opacity: 0.55;
        }

        .actions {
            flex: none;
            display: flex;
            gap: 0.25rem;
            opacity: 0;
            transform: translateX(4px);
            transition: opacity 0.2s, transform 0.2s;
        }

        .task:hover .actions,
        .task:focus-within .actions {
            opacity: 1;
            transform: none;
        }

        .icon-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            color: var(--ink-mute);
            display: grid;
            place-items: center;
            transition: background 0.2s, color 0.2s;
        }

        .icon-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
        }

        .icon-btn:hover {
            background: var(--surface-strong);
            color: var(--ink);
        }

        .icon-btn.danger:hover {
            color: var(--magenta);
        }

        /* Inline edit inputs reuse task layout */
        .edit-field {
            border: none;
            background: rgba(255, 255, 255, 0.06);
            color: var(--ink);
            font: inherit;
            border-radius: 8px;
            padding: 0.4rem 0.55rem;
            width: 100%;
        }

        .edit-field:focus {
            outline: 1.5px solid var(--violet);
        }

        .edit-field.detail-edit {
            font-size: 0.85rem;
            margin-top: 0.3rem;
            color: var(--ink-soft);
        }

        /* ===================== States ===================== */
        .empty {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--ink-mute);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }

        .empty[hidden],
        .list[hidden] {
            display: none;
        }

        .empty .halo {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 50% 40%, rgba(139, 92, 246, 0.35), transparent 70%);
            border: 1px solid var(--border);
        }

        .empty .halo svg {
            width: 32px;
            height: 32px;
            stroke: var(--ink-soft);
        }

        .empty h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            color: var(--ink-soft);
            font-size: 1.05rem;
        }

        .empty p {
            font-size: 0.88rem;
            max-width: 32ch;
        }

        .loading {
            text-align: center;
            padding: 2.5rem;
            color: var(--ink-mute);
            font-size: 0.9rem;
        }

        .loading[hidden] {
            display: none;
        }

        /* ===================== Toasts ===================== */
        .toasts {
            position: fixed;
            bottom: 1.4rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 50;
            width: min(92vw, 380px);
        }

        .toast {
            padding: 0.8rem 1rem;
            border-radius: 12px;
            font-size: 0.88rem;
            color: var(--ink);
            background: rgba(17, 22, 40, 0.9);
            border: 1px solid var(--border-strong);
            backdrop-filter: blur(12px);
            box-shadow: 0 16px 40px -18px rgba(0, 0, 0, 0.8);
            animation: toastIn 0.35s var(--ease) both;
        }

        .toast.error {
            border-color: rgba(236, 72, 153, 0.55);
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <section id="auth-screen" hidden>
        <div class="auth-card">
            <div class="brand auth-brand">
                <span class="mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 13a8 8 0 0 1 16 0" />
                        <path d="M12 5v-1M4.2 13H3M21 13h-1.2M6.3 7.3l-.8-.8M17.7 7.3l.8-.8" />
                        <path d="M9 17l2 2 4-4" />
                    </svg>
                </span>
                <h1>Aurora</h1>
            </div>
            <form class="glass composer auth-form" id="auth-form" autocomplete="off">
                <h2 class="auth-title" id="auth-title">Welcome back</h2>
                <input class="field" id="auth-email" type="email" placeholder="you@email.com"
                    aria-label="Email" autocomplete="email" required>
                <input class="field" id="auth-password" type="password" placeholder="Password"
                    aria-label="Password" autocomplete="current-password" minlength="6" required>
                <button class="add-btn auth-submit" id="auth-submit" type="submit">Log in</button>
                <p class="auth-switch">
                    <span id="auth-switch-text">New here?</span>
                    <button class="linklike" id="auth-toggle" type="button">Create an account</button>
                </p>
            </form>
        </div>
    </section>

    <main class="app" hidden>
        <header class="masthead">
            <div class="brand">
                <span class="mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 13a8 8 0 0 1 16 0" />
                        <path d="M12 5v-1M4.2 13H3M21 13h-1.2M6.3 7.3l-.8-.8M17.7 7.3l.8-.8" />
                        <path d="M9 17l2 2 4-4" />
                    </svg>
                </span>
                <div>
                    <h1>Aurora</h1>
                    <p class="tagline">A calmer place for your day's work.</p>
                </div>
                <div class="account">
                    <span id="user-email" class="tagline"></span>
                    <button class="linklike" id="sign-out" type="button">Sign out</button>
                </div>
            </div>
            <div class="stats">
                <span class="chip active"><span class="dot"></span><b id="count-active">0</b> active</span>
                <span class="chip done"><span class="dot"></span><b id="count-done">0</b> done</span>
            </div>
        </header>

        <form class="glass composer" id="add-form" autocomplete="off">
            <div class="composer-row">
                <input class="field" id="task-title" type="text" placeholder="What needs doing?"
                    aria-label="Task title" maxlength="160" required>
                <input id="task-photo" type="file" accept="image/*" hidden>
                <label class="attach-btn" id="attach-btn" for="task-photo" title="Attach a photo"
                    aria-label="Attach a photo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <path d="M21 15l-5-5L5 21" />
                    </svg>
                </label>
                <button class="add-btn" id="add-btn" type="submit" aria-label="Add task">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                </button>
            </div>
            <input class="field" id="task-detail" type="text" placeholder="Add a detail (optional)"
                aria-label="Task detail" maxlength="240">
            <div class="attach-preview" id="attach-preview" hidden>
                <img id="attach-thumb" alt="Selected photo preview">
                <span class="attach-name" id="attach-name"></span>
                <button type="button" class="attach-clear" id="attach-clear" aria-label="Remove photo">×</button>
            </div>
        </form>

        <div class="glass composer" role="search">
            <div class="composer-row">
                <input class="field" id="search-input" type="search" placeholder="Search tasks…"
                    aria-label="Search tasks" autocomplete="off">
            </div>
        </div>

        <div class="board-bar">
            <button class="clear-done" id="clear-done" hidden>Clear done</button>
        </div>

        <p class="loading" id="loading">Summoning your tasks…</p>

        <section class="board" id="board" hidden>
            <section class="column" data-status="todo">
                <header class="col-head">
                    <span class="col-title"><span class="col-dot todo"></span>To Do</span>
                    <span class="col-count" data-count="todo">0</span>
                </header>
                <ul class="col-list" data-status="todo" aria-label="To Do"></ul>
            </section>
            <section class="column" data-status="doing">
                <header class="col-head">
                    <span class="col-title"><span class="col-dot doing"></span>In Progress</span>
                    <span class="col-count" data-count="doing">0</span>
                </header>
                <ul class="col-list" data-status="doing" aria-label="In Progress"></ul>
            </section>
            <section class="column" data-status="done">
                <header class="col-head">
                    <span class="col-title"><span class="col-dot done"></span>Done</span>
                    <span class="col-count" data-count="done">0</span>
                </header>
                <ul class="col-list" data-status="done" aria-label="Done"></ul>
            </section>
        </section>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>
</body>

</html>
